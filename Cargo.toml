[package]
name = "asc"
version = "0.1.0"
edition = "2024"
default-run = "asc"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
memmap2 = "0.9"
flate2 = "1.0"
rayon = "1.8"
byteorder = "1.5"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
eframe = "0.27"
egui = "0.27"
crossbeam-channel = "0.5"
regex = "1.13.1"
lazy_static = "1.4"
phf = { version = "0.11", features = ["macros"] }
droidsaw-dex = "2.0"
