[workspace]
resolver = "2"
members = [
    "crates/asc-core",
    "crates/asc-cli",
    "vendor/droidsaw-dex",
    "vendor/axmldecoder",
]
default-members = ["crates/asc-core", "crates/asc-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
